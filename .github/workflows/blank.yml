name: Build ZOJO LAUNCHER

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          unzip -q "$(ls *.zip | head -1)" -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the APK
        run: cd "$PROJ" && gradle assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp "$PROJ/app/build/outputs/apk/release/app-release.apk" dist/ZOJO-Launcher.apk
          cp "$PROJ/docs/GETTING-STARTED.txt" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ZOJO-LAUNCHER-Android
          path: dist/# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
